name: Build and release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="${GITHUB_REF_NAME}"
            PRE=false
          else
            BASE="$(tr -d '[:space:]' < version.txt)"
            NAME="${BASE}-beta.${GITHUB_RUN_NUMBER}"
            PRE=true
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          ERR=$(grep -E '^e: |What went wrong|error:' -A4 build.log | head -50 | tr '\n' '\r' | sed 's/\r/%0A/g')
          echo "::error title=Build errors::${ERR}"

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ExpressiveWidgets-${{ steps.ver.outputs.name }}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="${{ steps.ver.outputs.name }}"
          FLAGS="--generate-notes"
          if [[ "${{ steps.ver.outputs.prerelease }}" == "true" ]]; then
            FLAGS="$FLAGS --prerelease"
          else
            FLAGS="$FLAGS --latest"
          fi
          gh release create "$NAME" "ExpressiveWidgets-${NAME}.apk" \
            --title "$NAME" --target "$GITHUB_SHA" $FLAGS
